<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>点亮吧!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      padding: 30px;
      max-width: 400px;
      width: 100%;
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 1.8em;
      color: #333;
      margin-bottom: 5px;
    }

    .header p {
      color: #666;
      font-size: 0.9em;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: bold;
      font-size: 0.95em;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1em;
      transition: border-color 0.3s;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    input::placeholder {
      color: #999;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 25px;
      flex-direction: column;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    .submit-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .location-btn {
      background: linear-gradient(135deg, #4ade80, #22c55e);
      color: white;
      margin-bottom: 10px;
    }

    .location-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(74, 222, 128, 0.4);
    }

    .location-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: bold;
      display: none;
      animation: slideIn 0.3s ease-out;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .message.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .success-animation {
      text-align: center;
      display: none;
    }

    .success-animation.show {
      display: block;
      animation: popIn 0.6s ease-out;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.3);
      }
      50% {
        opacity: 1;
        transform: scale(1.1);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .checkmark {
      font-size: 3em;
      margin-bottom: 15px;
    }

    .success-text {
      font-size: 1.5em;
      color: #667eea;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .province-name {
      font-size: 1.2em;
      color: #666;
    }

    .match-detail {
      margin-top: 10px;
      font-size: 0.9em;
      color: #666;
      line-height: 1.5;
      text-align: left;
    }

    .alt-list {
      margin-top: 8px;
      font-size: 0.85em;
      color: #888;
      line-height: 1.5;
      text-align: left;
      word-break: break-all;
    }

    .character-count {
      font-size: 0.8em;
      color: #999;
      margin-top: 4px;
    }

    .error-text {
      font-size: 0.85em;
      color: #d9534f;
      margin-top: 5px;
      display: none;
    }

    .error-text.show {
      display: block;
    }

    .records-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      overflow-y: auto;
      padding: 20px;
    }

    .records-modal.show {
      display: block;
    }

    .records-content {
      background: white;
      border-radius: 15px;
      max-width: 500px;
      margin: 0 auto;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideIn 0.3s ease-out;
    }

    .records-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid #e0e0e0;
      position: sticky;
      top: 0;
      background: white;
      z-index: 1;
    }

    .records-header h2 {
      margin: 0;
      font-size: 1.3em;
      color: #333;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5em;
      cursor: pointer;
      color: #666;
      padding: 5px;
      line-height: 1;
    }

    .close-btn:hover {
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎉 跨年互动地图</h1>
      <p>点亮你的家乡</p>
    </div>

    <div id="message" class="message"></div>

    <form id="form" style="display: none;">
      <div class="form-group">
        <label for="nickname">📝 昵称</label>
        <input
          type="text"
          id="nickname"
          placeholder="输入你的昵称（1-20字符）"
          maxlength="20"
          required
        />
        <div class="character-count">
          <span id="charCount">0</span>/20
        </div>
      </div>

      <div class="form-group">
        <label for="placeName">📍 地区全名</label>
        <input
          type="text"
          id="placeName"
          placeholder="如：广东省深圳市南山区 / 江苏省苏州市吴中区"
          maxlength="60"
          required
        />
        <div id="placeError" class="error-text">请输入地区全名</div>
      </div>

      <div class="form-group">
        <label for="blessing">💝 祝福语（选填，50字以内）</label>
        <input
          type="text"
          id="blessing"
          placeholder="写下你的祝福..."
          maxlength="50"
        />
        <div class="character-count">
          <span id="blessingCount">0</span>/50
        </div>
      </div>

      <div class="button-group">
      <button type="submit" class="submit-btn" id="submitBtn">✨ 点亮我的家乡</button>
    </div>
    </form>

    <div id="successAnimation" class="success-animation">
      <div class="checkmark">✨</div>
      <div class="success-text">提交成功！</div>
      <div class="province-name" id="successProvince"></div>
      <div class="match-detail" id="matchDetail"></div>
      <div class="alt-list" id="altList"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('form');
    const messageEl = document.getElementById('message');
    const nicknameInput = document.getElementById('nickname');
    const placeInput = document.getElementById('placeName');
    const blessingInput = document.getElementById('blessing');
    const submitBtn = document.getElementById('submitBtn');
    const successAnimation = document.getElementById('successAnimation');
    const charCountSpan = document.getElementById('charCount');
    const blessingCountSpan = document.getElementById('blessingCount');

    // 预设祝福语
    const defaultBlessings = [
      '新年快乐，万事如意！',
      '阖家幸福，身体健康！',
      '心想事成，前程似锦！',
      '平安喜乐，好运连连！',
      '工作顺利，财源广进！',
      '学业进步，金榜题名！',
      '爱情甜蜜，幸福美满！',
      '生活美满，笑口常开！',
      '身体健康，福寿安康！'
    ];

    // 敏感词列表
    const sensitiveWords = [
      '死', '杀', '暴力', '毒品', '赌博', '诈骗', '色情',
      '傻', '笨', '蠢', '废物', '垃圾', '滚',
      '妈的', '操', '日', '逼', '屄'
    ];

    form.style.display = 'block';

    // 更新字符计数
    nicknameInput.addEventListener('input', () => {
      charCountSpan.textContent = nicknameInput.value.length;
    });

    blessingInput.addEventListener('input', () => {
      blessingCountSpan.textContent = blessingInput.value.length;
    });

    // 显示消息
    function showMessage(text, type = 'info') {
      messageEl.textContent = text;
      messageEl.className = `message show ${type}`;
      if (type !== 'success') {
        setTimeout(() => {
          messageEl.classList.remove('show');
        }, 3000);
      }
    }

    // 防重复提交
    let isSubmitting = false;

    // 检查敏感词
    function containsSensitiveWord(text) {
      const lowerText = text.toLowerCase();
      return sensitiveWords.some(word => lowerText.includes(word));
    }

    // 获取随机祝福语
    function getRandomBlessing() {
      return defaultBlessings[Math.floor(Math.random() * defaultBlessings.length)];
    }

    // 提交表单
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // 防止重复提交
      if (isSubmitting) {
        return;
      }

      const nickname = nicknameInput.value.trim();
      const placeName = placeInput.value.trim();
      let blessing = blessingInput.value.trim();

      // 验证
      if (!nickname) {
        showMessage('❌ 昵称不能为空', 'error');
        nicknameInput.focus();
        return;
      }

      if (!placeName) {
        showMessage('❌ 请输入地区全名', 'error');
        placeInput.focus();
        return;
      }

      // 敏感词检测
      if (blessing && containsSensitiveWord(blessing)) {
        showMessage('❌ 祝福语包含不合适的内容，请修改后重试', 'error');
        blessingInput.focus();
        return;
      }

      // 如果没有填写祝福语，使用随机祝福语
      if (!blessing) {
        blessing = getRandomBlessing();
      }

      // 禁用提交按钮
      isSubmitting = true;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loading-spinner"></span>提交中...';

      try {
        const response = await fetch('/api/lights', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            nickname,
            placeName,
            blessing
          })
        });

        const data = await response.json();

        if (response.status === 429) {
          showMessage('⚠️ ' + data.message, 'error');
          isSubmitting = false;
          submitBtn.disabled = false;
          submitBtn.textContent = '✨ 点亮我的家乡';
          return;
        }

        if (data.ok && data.lit === false) {
          showMessage('⚠️ ' + (data.message || '未能匹配到地名，已记录输入'), 'info');
          isSubmitting = false;
          submitBtn.disabled = false;
          submitBtn.textContent = '✨ 点亮我的家乡';
          return;
        }

        if (data.ok) {
          // 显示成功动画
          form.style.display = 'none';
          successAnimation.classList.add('show');
          const matchedName = data?.matched?.name || '已点亮';
          document.getElementById('successProvince').innerHTML = 
            `已点亮：<span style="color: #ffb74d; font-weight: bold;">${matchedName}</span>`;

          const matchDetailEl = document.getElementById('matchDetail');
          const altListEl = document.getElementById('altList');
          matchDetailEl.textContent = `你输入：${placeName}；系统匹配：${matchedName}`;

          const alts = Array.isArray(data.alternatives) ? data.alternatives : [];
          if (alts.length > 0) {
            altListEl.textContent = `备选：${alts.slice(0, 3).map(x => x.name).join(' / ')}`;
          } else {
            altListEl.textContent = '';
          }

          // 3秒后重置表单
          setTimeout(() => {
            resetForm();
          }, 3000);
        } else {
          showMessage('❌ ' + data.message, 'error');
          isSubmitting = false;
          submitBtn.disabled = false;
          submitBtn.textContent = '✨ 点亮我的家乡';
        }
      } catch (error) {
        showMessage('❌ 网络错误，请检查连接并重试', 'error');
        isSubmitting = false;
        submitBtn.disabled = false;
        submitBtn.textContent = '✨ 点亮我的家乡';
        console.error(error);
      }
    });

    // 重置表单
    function resetForm() {
      form.style.display = 'block';
      successAnimation.classList.remove('show');
      form.reset();
      charCountSpan.textContent = '0';
      blessingCountSpan.textContent = '0';
      isSubmitting = false;
      submitBtn.disabled = false;
      submitBtn.textContent = '✨ 点亮我的家乡';
      nicknameInput.focus();
    }

    // 页面加载
    window.addEventListener('load', () => {
      nicknameInput.focus();
    });

    // 定位按钮点击事件
    const locationBtn = document.getElementById('locationBtn');
    locationBtn.addEventListener('click', async () => {
      if (!navigator.geolocation) {
        showMessage('您的浏览器不支持地理定位', 'error');
        return;
      }

      // 禁用定位按钮，防止重复点击
      locationBtn.disabled = true;
      locationBtn.innerHTML = '<span class="loading-spinner"></span>定位中...';

      try {
        // 获取当前地理位置
        const position = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 300000
          });
        });

        const { latitude, longitude } = position.coords;
        
        // 使用高德地图API进行逆地理编码
        const response = await fetch(`https://restapi.amap.com/v3/geocode/regeo?key=956391a96959b2310099b3747c23a063&location=${longitude},${latitude}&extensions=base`);
        const data = await response.json();

        if (data.status === '1' && data.regeocode) {
          const addressComponent = data.regeocode.addressComponent;
          const province = addressComponent.province;
          const city = addressComponent.city;
          const district = addressComponent.district;
          
          // 拼接完整地区名称
          const fullAddress = `${province}${city}${district}`;
          placeInput.value = fullAddress;
          showMessage('定位成功', 'success');
        } else {
          showMessage('定位成功，但获取地区名称失败', 'info');
        }
      } catch (error) {
        console.error('定位失败:', error);
        if (error.code === error.PERMISSION_DENIED) {
          showMessage('您拒绝了定位请求', 'error');
        } else if (error.code === error.POSITION_UNAVAILABLE) {
          showMessage('位置信息不可用', 'error');
        } else if (error.code === error.TIMEOUT) {
          showMessage('定位超时', 'error');
        } else {
          showMessage('定位失败，请手动输入', 'error');
        }
      } finally {
        // 恢复定位按钮状态
        locationBtn.disabled = false;
        locationBtn.innerHTML = '📍 自动定位';
      }
    });
  </script>
</body>
</html>
