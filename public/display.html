<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计算机学院互动地图</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.2/dist/echarts.min.js"></script>
  <!-- 注意：ECharts 中国地图需要额外注册 map 数据（china.json），否则 map: 'china' 无法渲染 -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body { /* 背景透明，防止遮挡 */
      font-family: 'Arial', sans-serif;
      background: none;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: url('./pics/BG2.png') no-repeat center center;
      background-size: contain;
      color: white;
      position: relative;
    }

    .map-header {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      text-align: center;
      width: 100%;
    }

    .map-header h1 {
      font-size: 2.2em;
      margin: 0;
      background: linear-gradient(135deg, #ffd700, #ffed4e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 2px 6px rgba(255, 215, 0, 0.5);
      max-width: 90%;
      display: inline-block;
    }

    .stats {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0;
      padding: 15px 0;
      width: 100%;
      align-items: center;
    }

    .stat-item {
      background: linear-gradient(135deg, rgba(49, 74, 67, 0.9), rgba(60, 90, 80, 0.9));
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(10px);
      height: auto;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .stat-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 215, 0, 0.2);
      border-color: rgba(255, 215, 0, 0.5);
    }

    .stat-value {
      color: #ffd700;
      font-weight: bold;
      font-size: 1.8em;
      min-width: 50px;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .stat-label {
      color: #ffffff;
      font-size: 1.0em;
      font-weight: 500;
    }

    .content {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
      gap: 18px;
      padding: 18px 18px 18px 18px;
      align-items: stretch;
      margin-top: 0;
    }

    .map-area {
      flex: 1;
      height: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      border: 2px solid rgba(254, 186, 7, 1);
      background: rgba(237, 81, 38, 0.3); /* 半透明黑色蒙版，增加地图对比度 */
    }

    .right-column {
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: 100%;
      background: rgba(244, 67, 54, 0.35);
      border-left: 3px solid rgba(254, 186, 7, 1);
      padding: 14px 14px 14px 18px;
    }
/* rgba(237,81,38) */
    .side-panel {
      background: rgba(49, 74, 67, 1);
      padding: 10px 15px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(254, 186, 7, 0.35);
      z-index: 50;
    }

    #map {
      width: 100%;
      height: 100%;
      transition: opacity 0.3s ease-in-out;
    }

    /* 加载指示器样式 */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease-in-out;
      background: transparent;
      pointer-events: none;
    }

    .loading-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .loading-panel {
      min-width: 260px;
      max-width: 360px;
      padding: 18px 20px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.68);
      border: 2px solid rgba(102, 126, 234, 0.35);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: auto;
    }

    .loading-spinner {
      width: 46px;
      height: 46px;
      border: 4px solid rgba(102, 126, 234, 0.3);
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 14px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      color: #fff;
      font-size: 1.05em;
      margin-bottom: 6px;
    }

    .loading-subtext {
      color: #aaa;
      font-size: 0.9em;
    }

    /* 地图层级指示器 */
    .level-indicator {
      position: absolute;
      top: 30px;
      right: 30px;
      background: rgba(244, 67, 54, 0.9);
      padding: 15px 20px;
      border-radius: 25px;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(102, 126, 234, 0.5);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease-in-out;
    }

    .level-indicator.pulse {
      animation: pulse 0.6s ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .level-text {
      color: #fff;
      font-size: 0.9em;
      font-weight: bold;
    }

    .level-icon {
      width: 8px;
      height: 8px;
      background: #667eea;
      border-radius: 50%;
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* 错误提示样式 */
    .error-toast {
      position: absolute;
      top: 100px;
      right: 30px;
      background: rgba(244, 67, 54, 0.9);
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
      z-index: 1001;
      opacity: 0;
      visibility: hidden;
      transform: translateX(100px);
      transition: all 0.3s ease-in-out;
      max-width: 300px;
    }

    .error-toast.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(0);
    }

    .error-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .error-message {
      font-size: 0.9em;
      line-height: 1.4;
    }

    /* QR 展示放入右侧栏，这里不再使用绝对定位面板 */

    .qrcode-section {
      text-align: center;
      margin-bottom: 20px;
    }

    .qrcode-section p {
      color: #ffd700;
      font-size: 1.1em;
      font-weight: bold;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    #qrcode {
      display: inline-block;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    #qrcode img {
      display: block;
      width: 140px;
      height: 140px;
    }

    .url-display {
      margin-top: 12px;
      font-size: 0.75em;
      color: #a4cab6;
      word-break: break-all;
      line-height: 1.4;
    }

    .divider {
      height: 1px;
      background: rgba(102, 126, 234, 0.3);
      margin: 15px 0;
    }

    .lit-list {
      text-align: left;
    }

    .history-list {
      margin-top: 12px;
    }

    .history-title {
      color: #ffd700;
      font-size: 1.1em;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 12px;
      letter-spacing: 1.5px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .admin-title {
      color: #ffd700;
      font-size: 1.1em;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 15px;
      letter-spacing: 1.5px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .history-box {
      max-height: 260px;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid rgba(102, 126, 234, 0.25);
      background: rgba(255, 255, 255, 0.04);
      padding: 10px 12px;
    }

    .history-item {
      font-size: 0.85em;
      color: #e2e7bf;
      line-height: 1.6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item .name {
      color: #fc7930;
      font-weight: bold;
    }

    .history-item .place {
      color: #a4cab6;
      font-weight: bold;
    }

    .admin-panel {
      background: transparent;
      padding: 0;
      border-radius: 0;
      border: none;
    }

    /* 已点亮模块已移除 */

    .admin-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 11px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.92em;
      font-weight: bold;
      transition: all 0.2s ease;
      display: block;
      width: 100%;
      margin-bottom: 10px;
      box-shadow: 0 6px 18px rgba(102, 126, 234, 0.25);
    }

    .admin-btn.secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(102, 126, 234, 0.55);
      box-shadow: none;
    }

    .admin-btn.danger {
      background: linear-gradient(135deg, #ff6b6b, #ff8787);
      box-shadow: 0 6px 18px rgba(255, 107, 107, 0.25);
    }


    .admin-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(102, 126, 234, 0.35);
    }

    .admin-btn.danger:hover:not(:disabled) {
      box-shadow: 0 10px 26px rgba(255, 107, 107, 0.35);
    }

    .admin-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .connection-status {
      position: absolute;
      top: 30px;
      left: 30px;
      padding: 10px 16px;
      border-radius: 25px;
      font-size: 0.9em;
      font-weight: bold;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(10px);
    }

    .connected {
      background: rgba(74, 222, 128, 0.2);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.4);
    }

    .disconnected {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    .connected .status-dot {
      background: #4ade80;
    }

    .disconnected .status-dot {
      background: #ef4444;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 14px 28px;
      border-radius: 8px;
      border: 2px solid #667eea;
      z-index: 200;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <div class="map-area">
        <div class="map-header">
          <h1>星灯载愿，逐光筑梦</h1>
        </div>
        <div id="map"></div>

        <!-- 加载指示器 -->
        <div class="loading-overlay" id="loadingOverlay">
          <div class="loading-panel">
            <div class="loading-spinner"></div>
            <div class="loading-text" id="loadingText">加载地图数据中...</div>
            <div class="loading-subtext" id="loadingSubtext">请稍候</div>
          </div>
        </div>

        <!-- 地图层级指示器 -->
        <div class="level-indicator" id="levelIndicator">
          <div class="level-icon"></div>
          <div class="level-text" id="levelText">省级地图</div>
        </div>

        <!-- 错误提示 -->
        <div class="error-toast" id="errorToast">
          <div class="error-title">加载失败</div>
          <div class="error-message" id="errorMessage">地图数据加载失败，请重试</div>
        </div>

        <!-- 连接状态（左上角） -->
        <div class="connection-status disconnected" id="status">
          <span class="status-dot"></span>
          <span id="statusText">连接中...</span>
        </div>

      </div>

      <!-- 右侧栏目：已点亮 + 点亮记录 -->
      <div class="right-column">
        <div class="side-panel">
          <div class="stats">
            <div class="stat-item">
              <span class="stat-value" id="litCount">0</span>
              <span class="stat-label">个区域已点亮</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="totalCount">0</span>
              <span class="stat-label">人次参与</span>
            </div>
          </div>
        </div>

        <div class="side-panel">
          <div class="history-list">
            <div class="history-title">点亮记录</div>
            <div class="history-box" id="historyBox"></div>
          </div>
        </div>

        <div class="side-panel">
          <div class="qrcode-section">
            <p>扫码参与</p>
            <div id="qrcode"></div>
            <div class="url-display" id="urlDisplay"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    let chart = null;
    let chartReady = false;
    let pendingMapUpdate = false;
    let litRegionState = {};
    let litRegionsMetaById = {};
    let historyItems = [];
    let historyTimer = null;

    const ws = new WebSocket(`${wsProtocol}//${window.location.host}`);
    let provinces = [];

    // 地图层级管理
    let currentMapLevel = 'province'; // province/city/district
    let geoDataCache = {}; // 缓存不同层级的地图数据
    let currentViewRegion = null; // 当前聚焦的省份/城市

    // 点击选择的钻取状态
    let selectedProvince = null; // {code,name}
    let selectedCity = null; // {code,name}
    let selectedCitiesGeoJson = null; // 当前省份的市级 GeoJSON

    // 交互序列号：用于取消/忽略过期的异步钻取结果（解决“退回省级后颜色/边界被旧请求覆盖”的竞态）
    let drillSeq = 0;

    // 自动聚焦：新点亮后自动移动到对应区域，并在 3 秒后自动回全国（若用户未操作）
    let autoReturnTimer = null;
    let autoReturnActive = false;
    let autoReturnCancelledByUser = false;

    // 自动聚焦队列：按到达顺序串行执行，避免多个点亮请求互相打断
    const autoFocusQueue = [];
    let autoFocusProcessing = false;

    function isChartUsable() {
      if (!chart || !chartReady) return false;
      try {
        if (typeof chart.isDisposed === 'function' && chart.isDisposed()) return false;
        if (typeof chart.getDom === 'function' && !chart.getDom()) return false;
      } catch {
        return false;
      }
      return true;
    }

    // 地图上“步骤提示”文字（省/市/区县）
    let focusLabelTimer = null;
    let fireworkTimer = null;

    // 当前正在播放的烟花 graphic group id（用于可靠移除，避免 id 冲突）
    let currentFireworkGroupId = null;

    // 在 initECharts 前也会被引用：先声明避免 TDZ
    let CHINA_BOUNDING_COORDS = null;

    // 让“地区字/烟花”锚定在经纬度：拖动/缩放时可实时重算像素位置
    let focusLabelState = null; // { text, coord:[lng,lat], geoIndex }

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function normalizeLonLat(coord) {
      /*
      标准化经纬度坐标为 [lon, lat] 格式
      */
      if (!Array.isArray(coord) || coord.length !== 2) return null;
      let a = Number(coord[0]);
      let b = Number(coord[1]);
      if (!Number.isFinite(a) || !Number.isFinite(b)) return null;

      const cand1 = [a, b];
      const cand2 = [b, a];

      function inChinaBounds(c) {
        if (!CHINA_BOUNDING_COORDS) return false;
        const lt = CHINA_BOUNDING_COORDS?.[0];
        const rb = CHINA_BOUNDING_COORDS?.[1];
        if (!Array.isArray(lt) || !Array.isArray(rb)) return false;
        const minLon = Number(lt[0]);
        const maxLon = Number(rb[0]);
        const maxLat = Number(lt[1]);
        const minLat = Number(rb[1]);
        const lon = Number(c?.[0]);
        const lat = Number(c?.[1]);
        if (![minLon, maxLon, minLat, maxLat, lon, lat].every(Number.isFinite)) return false;
        return lon >= minLon - 1 && lon <= maxLon + 1 && lat >= minLat - 1 && lat <= maxLat + 1;
      }

      // 范围粗略：lon ~ [70, 140], lat ~ [10, 60]
      const looksLikeChinaLonLat = (c) => {
        const lon = Number(c?.[0]);
        const lat = Number(c?.[1]);
        if (!Number.isFinite(lon) || !Number.isFinite(lat)) return false;
        if (inChinaBounds(c)) return true;
        return lon >= 70 && lon <= 140 && lat >= 10 && lat <= 60;
      };

      // 优先选择“更像中国经纬度”的排列
      const ok1 = looksLikeChinaLonLat(cand1);
      const ok2 = looksLikeChinaLonLat(cand2);
      if (ok1 && !ok2) return cand1;
      if (ok2 && !ok1) return cand2;

      // 兜底：若疑似传入 [lat, lon]，做一次交换修正
      const looksLikeLat = (x) => x >= 0 && x <= 60;
      const looksLikeLon = (x) => x >= 70 && x <= 150;
      if (looksLikeLat(a) && looksLikeLon(b)) return [b, a];
      return cand1;
    }

    function isLonLatInChina(coord) {
      /*
      判断经纬度是否在中国范围内
      */
      const c = normalizeLonLat(coord);
      if (!c) return false;
      const lon = Number(c[0]);
      const lat = Number(c[1]);
      if (!Number.isFinite(lon) || !Number.isFinite(lat)) return false;

      if (CHINA_BOUNDING_COORDS) {
        const lt = CHINA_BOUNDING_COORDS?.[0];
        const rb = CHINA_BOUNDING_COORDS?.[1];
        if (Array.isArray(lt) && Array.isArray(rb)) {
          const minLon = Number(lt[0]);
          const maxLon = Number(rb[0]);
          const maxLat = Number(lt[1]);
          const minLat = Number(rb[1]);
          if ([minLon, maxLon, minLat, maxLat].every(Number.isFinite)) {
            return lon >= minLon - 1 && lon <= maxLon + 1 && lat >= minLat - 1 && lat <= maxLat + 1;
          }
        }
      }

      return lon >= 70 && lon <= 140 && lat >= 10 && lat <= 60;
    }

    function pickFeatureCoord(feature) {
      /*
      从 GeoJSON Feature 中提取经纬度坐标
      */
      const props = feature?.properties || {};
      const c = props?.centroid || props?.center || props?.cp;
      if (!Array.isArray(c) || c.length !== 2) return null;
      const x = Number(c[0]);
      const y = Number(c[1]);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
      return normalizeLonLat([x, y]);
    }

    function pickMatchedCoord(matched) {
      /*
      从匹配结果中提取经纬度坐标
      */
      const rawId = String(matched?.id || '').trim();
      const lvl = matched?.level || inferLevelFromAdcode(rawId);
      const id = normalizeRegionIdByLevel(rawId, lvl);
      let raw = matched?.centroid || litRegionsMetaById?.[id]?.centroid;

      // 兼容 meta 使用短码（省2位、市4位）存储的情况
      if (!raw && /^\d{6}$/.test(id)) {
        if (id.endsWith('0000')) raw = litRegionsMetaById?.[id.slice(0, 2)]?.centroid;
        else if (id.endsWith('00')) raw = litRegionsMetaById?.[id.slice(0, 4)]?.centroid;
      }
      if (Array.isArray(raw) && raw.length === 2) {
        const x = Number(raw[0]);
        const y = Number(raw[1]);
        if (Number.isFinite(x) && Number.isFinite(y)) return normalizeLonLat([x, y]);
      }
      return null;
    }

    function geoIndexForLevel(level) {
      /*
      获取 ECharts geo 组件索引
      */
      if (level === 'city') return 1;
      if (level === 'district') return 2;
      return 0;
    }

    function regionNameForLevelId(level, id) {
      /*
      根据层级和 ID 获取地区名称
      */
      const sid = String(id || '').trim();
      if (!sid) return '';
      if (level === 'city') return cityFeatureNameById?.get(sid) || '';
      if (level === 'district') return districtFeatureNameById?.get(sid) || '';
      return provinceFeatureNameById?.get(sid) || '';
    }

    function getRegionCenterFromECharts(level, id) {
      /*
      从 ECharts geo 组件获取地区中心点坐标
      */
      if (!chart || !chartReady) return null;
      const name = regionNameForLevelId(level, id);
      if (!name) return null;
      const gi = geoIndexForLevel(level);
      try {
        const model = chart.getModel && chart.getModel();
        const geoComp = model?.getComponent ? model.getComponent('geo', gi) : null;
        const cs = geoComp?.coordinateSystem;
        const region = cs?.getRegion ? cs.getRegion(name) : null;
        const center = region?.getCenter ? region.getCenter() : null;
        const c = normalizeLonLat(center);
        if (c && isLonLatInChina(c)) return { coord: c, geoIndex: gi };
      } catch {
        // ignore
      }
      return null;

      if (fromCs?.coord) return fromCs;
      const c = normalizeLonLat(fallbackCoord);
      if (c && isLonLatInChina(c)) return { coord: c, geoIndex: geoIndexForLevel(level) };

    function updateFocusLabelPosition() {
      /*
      更新焦点标签位置（拖动/缩放时调用）
      */
      if (!chart || !chartReady) return;
      if (!focusLabelState?.coord || !focusLabelState?.text) return;
      const px = chart.convertToPixel({ geoIndex: 0 }, focusLabelState.coord);
      if (!Array.isArray(px) || px.length !== 2) return;

      const w = chart.getWidth ? chart.getWidth() : 0;
      const h = chart.getHeight ? chart.getHeight() : 0;
      let left = Number(px[0]);
      let top = Number(px[1]);
      if (!Number.isFinite(left) || !Number.isFinite(top)) return;

      const margin = 14;
      const yOffsetUp = 26;
      const yOffsetDown = 28;
      const xMaxShift = 90;
      if (top < 60) top += yOffsetDown;
      else top -= yOffsetUp;
      if (w > 0) {
        if (left < margin + xMaxShift) left = Math.max(margin, left + xMaxShift * 0.6);
        if (left > w - margin - xMaxShift) left = Math.min(w - margin, left - xMaxShift * 0.6);
      }
      if (h > 0 && top > h - 40) top = h - 40;

      chart.setOption(
        {
          graphic: [
            {
              id: 'focusLabel',
              left,
              top,
              style: { text: String(focusLabelState.text) }
            }
          ]
        },
        { notMerge: false, lazyUpdate: true, silent: true }
      );
    }

      // 位置动态偏移：默认在点上方；靠近边缘则自动翻转/内收
      const margin = 14;

      const yOffsetDown = 28;
      const xMaxShift = 90;

      // 上边缘太近：放到点下方
      if (top < 60) top += yOffsetDown;
      else top -= yOffsetUp;

      // 左右边缘：向内收
      if (w > 0) {
        if (left < margin + xMaxShift) left = Math.max(margin, left + xMaxShift * 0.6);
        if (left > w - margin - xMaxShift) left = Math.min(w - margin, left - xMaxShift * 0.6);
      }

      // 下边缘：再向上收一点

        },
        { notMerge: false, lazyUpdate: false, silent: true }
      );

      const t0 = performance.now();
      const riseMs = 820;
      const boomMs = 760;
      const blessMs = 1580;
      const totalMs = riseMs + boomMs + blessMs;
      return new Promise(resolve => {
        function step(now) {
          if (mySeq !== fireworkSeq) {
            resolve();

          // 每帧重算锚点像素：保证烟花爆点永远贴合地图位置
          const apx = chart.convertToPixel({ geoIndex: gi }, c);

            const ay = Number(apx[1]);

            if (Number.isFinite(ax) && Number.isFinite(ay)) {
              const ww = chart.getWidth();
              const hh = chart.getHeight();

              tx = clamp(ax, 18, ww - 18);
              sy = clamp(ay, 18, hh - 80);
              ty = clamp(sy - 190, 18, hh - 18);
            }
          }
          else{
            console.error('❌ convertToPixel 失败！返回:', apx);
          }

          const dt = now - t0;
          if (dt <= riseMs) {
            const k = easeInOutCubic(dt / riseMs);
            const cy = sy + (ty - sy) * k;
            chart.setOption(
              {
                graphic: [
                  {
                    id: groupId,
                    children: [
                      {
                        id: trailId,
                        type: 'line',

                        shape: { cx: tx, cy: cy, r: 9 - 3 * k}

                      { id: blessId, invisible: true }
                    ]
                  }
                ]
              },
              { notMerge: false, lazyUpdate: false, silent: true }
            );
          } else if (dt <= riseMs + boomMs) {
            const t = (dt - riseMs) / boomMs;
            const k = easeInOutCubic(t);
            const alpha = clamp(1 - k, 0, 1);
            chart.setOption(
              {
                graphic: [
                  {
                    id: groupId,
                    children: [
                      { id: rocketId, invisible: true },
                      { id: trailId, invisible: true },

                      })),
                      { id: blessId, invisible: true }
                    ]
                  }
                ]
              },
              { notMerge: false, lazyUpdate: false, silent: true }
            );
          } else {
            const t = clamp((dt - riseMs - boomMs) / blessMs, 0, 1);
            const k = easeInOutCubic(t);
            const opacity = t < 0.65 ? k : (1 - (t - 0.65) / 0.35);
            chart.setOption(
              {
                graphic: [
                  {
                    id: groupId,
                    children: [
                      { id: rocketId, invisible: true },
                      { id: trailId, invisible: true },
                      ...particles.map(p => ({ id: p.id, invisible: true })),

                          lineWidth: 4
                        }
                      }
                    ]
                  }
                ]
              },
              { notMerge: false, lazyUpdate: false, silent: true }
            );
          }

          if (dt < totalMs) {
            requestAnimationFrame(step);
          } else {
            fireworkTimer = setTimeout(() => {
              if (mySeq === fireworkSeq && currentFireworkGroupId === groupId) {
                clearFirework();
              }
              resolve();
            }, 0);
          }
        }
        requestAnimationFrame(step);
      });
    }

    function isAdcode6(s) {
      return /^\d{6}$/.test(String(s || ''));
    }

    function isProvinceAdcode(s) {
      const x = String(s || '');
      return isAdcode6(x) && x.endsWith('0000');
    }

    function isCityAdcode(s) {
      const x = String(s || '');
      return isAdcode6(x) && x.endsWith('00') && !x.endsWith('0000');
    }

    function isDistrictAdcode(s) {
      const x = String(s || '');
      return isAdcode6(x) && !x.endsWith('00');
    }

    function inferLevelFromAdcode(id) {
      const s = String(id || '').trim();
      if (!isAdcode6(s)) return null;
      if (s.endsWith('0000')) return 'province';
      if (s.endsWith('00')) return 'city';
      return 'district';
    }

    function normalizeRegionIdByLevel(id, level) {
      const s0 = String(id ?? '').trim();
      if (!s0) return '';
      // 兼容数字/字符串，避免前导 0 的干扰
      const s = s0.replace(/^0+/, '') || '0';
      if (/^\d{6}$/.test(s)) return s;
      if (/^\d{2}$/.test(s)) return s + '0000';
      if (/^\d{4}$/.test(s)) return s + '00';
      if (/^\d{6,}$/.test(s)) return s.slice(0, 6);

      const lvl = String(level || '').trim();
      if (lvl === 'province' && /^\d{2}$/.test(s0)) return s0 + '0000';
      if (lvl === 'city' && /^\d{4}$/.test(s0)) return s0 + '00';
      return s0;
    }

    function provinceIdFromAny(id) {
      const s = String(id || '').trim();
      if (!isAdcode6(s)) return null;
      return s.slice(0, 2) + '0000';
    }

    function cityIdFromAny(id) {
      const s = String(id || '').trim();
      if (!isAdcode6(s)) return null;
      return s.slice(0, 4) + '00';
    }

    async function ensureChinaMapRegistered() {
      if (echarts.getMap && echarts.getMap('china')) return;

      // 优先加载后端提供的 GeoJSON（支持县/区级，若无则后端自动回退到省级）
      const apiUrl = '/api/geo/china';
      // 次选加载本地内置地图（无外网/弱网也能渲染）
      const localUrl = '/vendor/echarts/map/json/china.json';
      const fallbackUrl = 'https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json';

      const tryFetch = async (url) => {
        const res = await fetch(url, { cache: 'force-cache' });
        if (!res.ok) throw new Error(`加载地图失败: ${url} (${res.status})`);
        return res.json();
      };

      let geojson;
      try {
        geojson = await tryFetch(apiUrl);
      } catch (e) {
        console.warn(e);
        try {
          geojson = await tryFetch(localUrl);
        } catch (e2) {
          console.warn(e2);
          geojson = await tryFetch(fallbackUrl);
        }
      }

      echarts.registerMap('china', geojson);
    }

    function getCentroidByRegionId(id) {
      const meta = litRegionsMetaById[String(id)];
      const c = meta?.centroid;
      if (Array.isArray(c) && c.length === 2 && Number.isFinite(Number(c[0])) && Number.isFinite(Number(c[1]))) {
        return [Number(c[0]), Number(c[1])];
      }
      return null;
    }

    function clamp01(x) {
      return Math.max(0, Math.min(1, x));
    }

    function hexToRgb(hex) {
      const h = (hex || '').replace('#', '').trim();
      if (h.length !== 6) return { r: 0, g: 0, b: 0 };
      return {
        r: parseInt(h.slice(0, 2), 16),
        g: parseInt(h.slice(2, 4), 16),
        b: parseInt(h.slice(4, 6), 16)
      };
    }

    function rgbToHex(r, g, b) {
      const to2 = (n) => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, '0');
      return `#${to2(r)}${to2(g)}${to2(b)}`;
    }

    function blendHex(a, b, t) {
      const ta = clamp01(t);
      const ca = hexToRgb(a);
      const cb = hexToRgb(b);
      return rgbToHex(
        ca.r + (cb.r - ca.r) * ta,
        ca.g + (cb.g - ca.g) * ta,
        ca.b + (cb.b - ca.b) * ta
      );
    }

    // 初始化 ECharts

    // overlay 同步节流：拖动时只在 rAF 执行一次 setOption，且不做任何更新动画
    let pendingOverlaySync = false;
    let lastOverlayView = null;

    function computeBoundingCoords(geojson) {
      const features = Array.isArray(geojson?.features) ? geojson.features : [];
      let minLng = Infinity;
      let minLat = Infinity;
      let maxLng = -Infinity;
      let maxLat = -Infinity;

      function visitCoords(coords) {
        if (!coords) return;
        if (typeof coords[0] === 'number' && typeof coords[1] === 'number') {
          const lng = coords[0];
          const lat = coords[1];
          if (Number.isFinite(lng) && Number.isFinite(lat)) {
            minLng = Math.min(minLng, lng);
            maxLng = Math.max(maxLng, lng);
            minLat = Math.min(minLat, lat);
            maxLat = Math.max(maxLat, lat);
          }
          return;
        }
        if (Array.isArray(coords)) {
          for (const c of coords) visitCoords(c);
        }
      }

      for (const f of features) {
        visitCoords(f?.geometry?.coordinates);
      }

      if (![minLng, minLat, maxLng, maxLat].every(Number.isFinite)) return null;
      // ECharts: [[leftTopLng, leftTopLat], [rightBottomLng, rightBottomLat]]
      return [
        [minLng, maxLat],
        [maxLng, minLat]
      ];
    }

    function getBaseGeoView() {
      // 优先读取“实时坐标系”状态，避免 getOption 拿到旧 center/zoom 导致 overlay 错位
      try {
        const model = chart?.getModel ? chart.getModel() : null;
        const geoComp = model?.getComponent ? model.getComponent('geo', 0) : null;
        const cs = geoComp?.coordinateSystem;
        const c = cs?.getCenter ? cs.getCenter() : null;
        const z = cs?.getZoom ? cs.getZoom() : null;
        if (Array.isArray(c) && c.length === 2 && Number.isFinite(Number(c[0])) && Number.isFinite(Number(c[1])) && Number.isFinite(Number(z))) {
          return { center: [Number(c[0]), Number(c[1])], zoom: Number(z) };
        }
      } catch {
        // ignore
      }
      const opt = chart?.getOption ? chart.getOption() : null;
      const baseGeo = Array.isArray(opt?.geo) ? opt.geo[0] : opt?.geo;
      return {
        center: baseGeo?.center,
        zoom: baseGeo?.zoom
      };
    }

    function syncOverlayGeoView(params) {
      if (!chart) return;

      // 获取当前触发事件的 geo 组件的视图
      const currentGeo = chart.getModel().getComponent('geo', params?.componentIndex);
      if (!currentGeo) return;
      
      // 获取当前视图中心和缩放级别
      const center = currentGeo.get('center');
      const zoom = currentGeo.get('zoom');
      
      if (!Array.isArray(center) || !Number.isFinite(zoom)) return;
      
      lastOverlayView = { center: center.slice(), zoom: Number(zoom) };
      if (pendingOverlaySync) return;
      pendingOverlaySync = true;
      
      requestAnimationFrame(() => {
        pendingOverlaySync = false;
        if (!chart || !lastOverlayView) return;
        chart.setOption(
          {
            // 关键：禁止 update 动画，否则会出现“顿一下再平滑跟随”的错觉
            animation: false,
            animationDurationUpdate: 0,
            animationEasingUpdate: 'linear',
            geo: [
              // 基础 geo 组件，同步当前视图
              { center: lastOverlayView.center, zoom: lastOverlayView.zoom },
              // 城市覆盖层，同步当前视图
              { center: lastOverlayView.center, zoom: lastOverlayView.zoom },
              // 区县覆盖层，同步当前视图
              { center: lastOverlayView.center, zoom: lastOverlayView.zoom }
            ]
          },
          { notMerge: false, lazyUpdate: true, silent: true }
        );
      });
    }

    function clamp(n, min, max) {
      /*限制数值在 min 和 max 之间*/
      return Math.max(min, Math.min(max, n));
    }

    function easeInOutCubic(t) {
      /*缓动函数：easeInOutCubic*/
      const x = clamp(t, 0, 1);
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    }

    // 取消在途视图动画：避免并发动画导致边界/视图错位
    let geoAnimSeq = 0;

    function animateGeoViewTo(targetCenter, targetZoom, durationMs = 700) {
      if (!chart || !chartReady) return Promise.resolve();
      if (!Array.isArray(targetCenter) || targetCenter.length !== 2) return Promise.resolve();
      if (!Number.isFinite(targetCenter[0]) || !Number.isFinite(targetCenter[1])) return Promise.resolve();

      const myAnim = ++geoAnimSeq;

      const start = performance.now();
      const base = getBaseGeoView();
      const startCenter = Array.isArray(base.center) ? base.center.slice() : null;
      const startZoom = Number.isFinite(base.zoom) ? Number(base.zoom) : 1;

      if (!startCenter) {
        chart.setOption(
          {
            geo: [
              { center: targetCenter, zoom: targetZoom },
              { center: targetCenter, zoom: targetZoom },
              { center: targetCenter, zoom: targetZoom }
            ]
          },
          { notMerge: false }
        );
        return Promise.resolve();
      }

      return new Promise((resolve) => {
        function step(now) {
          if (myAnim !== geoAnimSeq) {
            resolve();
            return;
          }
          const t = (now - start) / durationMs;
          const k = easeInOutCubic(t);
          const center = [
            startCenter[0] + (targetCenter[0] - startCenter[0]) * k,
            startCenter[1] + (targetCenter[1] - startCenter[1]) * k
          ];
          const zoom = startZoom + (targetZoom - startZoom) * k;
          chart.setOption(
            {
              geo: [
                { center, zoom },
                { center, zoom },
                { center, zoom }
              ]
            },
            { notMerge: false, lazyUpdate: true, silent: true }
          );

          // 若此时有“引导文字”，确保动画帧内也同步位置
          updateFocusLabelPosition();
          if (t < 1) {
            requestAnimationFrame(step);
          } else {
            resolve();
          }
        }
        requestAnimationFrame(step);
      });
    }

    function computeBBoxFromCoords(coords, bbox) {
      if (!coords) return bbox;
      if (typeof coords[0] === 'number' && typeof coords[1] === 'number') {
        const lon = Number(coords[0]);
        const lat = Number(coords[1]);
        if (Number.isFinite(lon) && Number.isFinite(lat)) {
          bbox.minLon = Math.min(bbox.minLon, lon);
          bbox.maxLon = Math.max(bbox.maxLon, lon);
          bbox.minLat = Math.min(bbox.minLat, lat);
          bbox.maxLat = Math.max(bbox.maxLat, lat);
        }
        return bbox;
      }
      if (Array.isArray(coords)) {
        for (const c of coords) computeBBoxFromCoords(c, bbox);
      }
      return bbox;
    }

    function featureLonLatBBox(feature) {
      const geom = feature?.geometry;
      if (!geom) return null;
      const bbox = { minLon: Infinity, maxLon: -Infinity, minLat: Infinity, maxLat: -Infinity };
      computeBBoxFromCoords(geom.coordinates, bbox);
      if (!Number.isFinite(bbox.minLon) || !Number.isFinite(bbox.maxLon) || !Number.isFinite(bbox.minLat) || !Number.isFinite(bbox.maxLat)) return null;
      return bbox;
    }

    function featureCenterFromGeometry(feature) {
      const bb = featureLonLatBBox(feature);
      if (!bb) return null;
      const lon = (bb.minLon + bb.maxLon) / 2;
      const lat = (bb.minLat + bb.maxLat) / 2;
      const c = normalizeLonLat([lon, lat]);
      if (c && isLonLatInChina(c)) return c;
      return null;
    }

    function computeProvinceTargetZoom(provinceFeature) {
      const pb = featureLonLatBBox(provinceFeature);
      if (!pb || !CHINA_BOUNDING_COORDS) return null;
      const cMin = CHINA_BOUNDING_COORDS?.[0];
      const cMax = CHINA_BOUNDING_COORDS?.[1];
      if (!Array.isArray(cMin) || !Array.isArray(cMax)) return null;

      const chinaLonRange = Math.max(1e-6, Math.abs(Number(cMax[0]) - Number(cMin[0])));
      const chinaLatRange = Math.max(1e-6, Math.abs(Number(cMax[1]) - Number(cMin[1])));
      const provLonRange = Math.max(1e-6, Math.abs(pb.maxLon - pb.minLon));
      const provLatRange = Math.max(1e-6, Math.abs(pb.maxLat - pb.minLat));

      // 目标：省份大致占视野 78%（稍微更放大一些；一次性算出“合适 zoom”，过大则缩小，过小则放大）
      const k = 0.78;
      const zLon = (chinaLonRange / provLonRange) * k;
      const zLat = (chinaLatRange / provLatRange) * k;
      const z = Math.min(zLon, zLat);
      return clamp(z, 1.2, 6.0);
    }

    function computeCityTargetZoom(cityFeature) {
      const cb = featureLonLatBBox(cityFeature);
      if (!cb || !CHINA_BOUNDING_COORDS) return null;
      const cMin = CHINA_BOUNDING_COORDS?.[0];
      const cMax = CHINA_BOUNDING_COORDS?.[1];
      if (!Array.isArray(cMin) || !Array.isArray(cMax)) return null;

      const chinaLonRange = Math.max(1e-6, Math.abs(Number(cMax[0]) - Number(cMin[0])));
      const chinaLatRange = Math.max(1e-6, Math.abs(Number(cMax[1]) - Number(cMin[1])));
      const cityLonRange = Math.max(1e-6, Math.abs(cb.maxLon - cb.minLon));
      const cityLatRange = Math.max(1e-6, Math.abs(cb.maxLat - cb.minLat));

      // 目标：城市在视野中更大一些，方便点区县
      const k = 0.92;
      const zLon = (chinaLonRange / cityLonRange) * k;
      const zLat = (chinaLatRange / cityLatRange) * k;
      const z = Math.min(zLon, zLat);
      return clamp(z, 2.2, 12.0);
    }

    function computeDistrictTargetZoom(districtFeature) {
      const db = featureLonLatBBox(districtFeature);
      if (!db || !CHINA_BOUNDING_COORDS) return null;
      const cMin = CHINA_BOUNDING_COORDS?.[0];
      const cMax = CHINA_BOUNDING_COORDS?.[1];
      if (!Array.isArray(cMin) || !Array.isArray(cMax)) return null;

      const chinaLonRange = Math.max(1e-6, Math.abs(Number(cMax[0]) - Number(cMin[0])));
      const chinaLatRange = Math.max(1e-6, Math.abs(Number(cMax[1]) - Number(cMin[1])));
      const dLonRange = Math.max(1e-6, Math.abs(db.maxLon - db.minLon));
      const dLatRange = Math.max(1e-6, Math.abs(db.maxLat - db.minLat));

      const k = 1.10;
      const zLon = (chinaLonRange / dLonRange) * k;
      const zLat = (chinaLatRange / dLatRange) * k;
      const z = Math.min(zLon, zLat);
      return clamp(z, 4.0, 18.0);
    }

    function setDistrictBordersMap(cityCode, geojson, viewOverride = null) {
      const mapName = `districts_${cityCode}`;
      echarts.registerMap(mapName, geojson);
      districtFeatureNameById = buildFeatureNameById(geojson);
      districtFeatureById = new Map();
      for (const f of (Array.isArray(geojson?.features) ? geojson.features : [])) {
        const props = f?.properties || {};
        const id = pickAdcode(props);
        if (!id) continue;
        if (!districtFeatureById.has(String(id))) districtFeatureById.set(String(id), f);
      }
      const base = getBaseGeoView();
      const view = (viewOverride && Array.isArray(viewOverride.center) && Number.isFinite(viewOverride.zoom))
        ? viewOverride
        : (Array.isArray(base.center) && Number.isFinite(base.zoom))
          ? base
          : { center: INITIAL_VIEW.center, zoom: INITIAL_VIEW.zoom };
      chart.setOption(
        {
          geo: [
            // base geo：处理所有拖动缩放事件
            { silent: false, roam: true, emphasis: { label: { show: true } } },
            // 市级 overlay：允许 hover 其它市，不处理拖动缩放
            { show: true, roam: false, silent: false },
            {
              show: true,
              map: mapName,
              roam: false, // 不处理拖动缩放，只响应悬停事件
              silent: false, // 允许悬停事件
              center: view.center,
              zoom: view.zoom,
              boundingCoords: CHINA_BOUNDING_COORDS || undefined
            }
          ]
        },
        { notMerge: false }
      );
    }

    function applyLayerColors() {
      if (!chart) return;

      const provinceExclude = (currentMapLevel === 'province' || !selectedProvince) ? null : String(selectedProvince.code);
      const cityExclude = (currentMapLevel === 'district' && selectedCity) ? String(selectedCity.code) : null;

      const provinceRegions = [];
      for (const [id, st] of Object.entries(litRegionState || {})) {
        if (!isProvinceAdcode(id)) continue;
        const cnt = Number(st?.count || 0);
        if (!(cnt > 0)) continue;
        if (provinceExclude && String(id) === provinceExclude) continue;
        const name = provinceFeatureNameById.get(String(id)) || litRegionsMetaById[String(id)]?.name || st?.matchedName || String(id);
        provinceRegions.push({

            label: { show: true, fontSize: 12, color: colorForCountFont(cnt) }
          }
        });
      }

      const cityRegions = [];
      if (selectedProvince && currentMapLevel !== 'province') {
        const p2 = String(selectedProvince.code).slice(0, 2);
        for (const [id, st] of Object.entries(litRegionState || {})) {
          if (!isCityAdcode(id)) continue;
          if (!String(id).startsWith(p2)) continue;
          const cnt = Number(st?.count || 0);

          if (cityExclude && String(id) === cityExclude) continue;
          const name = cityFeatureNameById.get(String(id)) || litRegionsMetaById[String(id)]?.name || st?.matchedName || String(id);
          cityRegions.push({
            name,
            itemStyle: { areaColor: colorForCount(cnt) },
            emphasis: { 
              itemStyle: { areaColor: colorForCount(cnt) },
              label: { show: true, fontSize: 12, color: colorForCountFont(cnt) }
            }
          });
        }
      }

      const districtRegions = [];
      if (selectedCity && currentMapLevel === 'district') {
        const c4 = String(selectedCity.code).slice(0, 4);
        for (const [id, st] of Object.entries(litRegionState || {})) {
          if (!isDistrictAdcode(id)) continue;
          if (!String(id).startsWith(c4)) continue;

          if (!(cnt > 0)) continue;
          const name = districtFeatureNameById.get(String(id)) || litRegionsMetaById[String(id)]?.name || st?.matchedName || String(id);
          districtRegions.push({
            name,
            itemStyle: { areaColor: colorForCount(cnt) },

              itemStyle: { areaColor: colorForCount(cnt) },
              label: { show: true, fontSize: 12, color: colorForCountFont(cnt) }

    async function drillToProvinceByCode(provinceCode, { animate = true } = {}) {
      const mySeq = ++drillSeq;
      await ensureProvinceHitGeoLoaded();

      const id = String(provinceCode || '').trim();
      if (!isAdcode6(id)) return;

      const name = provinceFeatureNameById.get(id) || litRegionsMetaById[id]?.name || id;
      selectedProvince = { code: id, name };
      selectedCity = null;
      selectedCitiesGeoJson = null;
      currentMapLevel = 'city';
      currentViewRegion = id;
      UIController.updateLevelIndicator('layered', `${name} - 市级边界`);

      await new Promise(requestAnimationFrame);

      const cacheKey = `province:${id}:citiesGeo`;
      const fetchPromise = (async () => {
        if (geoDataCache[cacheKey]) return geoDataCache[cacheKey];
        const response = await fetch(`/api/geo/province/${id}`);
        if (!response.ok) throw new Error(`市级边界接口返回 HTTP ${response.status}`);
        const geojson = await response.json();
        geoDataCache[cacheKey] = geojson;
        return geojson;
      })();

      const pFeature = provinceFeatureById.get(id) || null;
      const pProps = pFeature?.properties || {};
      const pc = pProps?.centroid || pProps?.center || pProps?.cp;
      const pCenter = (Array.isArray(pc) && pc.length === 2 && Number.isFinite(Number(pc[0])) && Number.isFinite(Number(pc[1])))
        ? [Number(pc[0]), Number(pc[1])]
        : null;
      const pZoom = computeProvinceTargetZoom(pFeature);
      const animPromise = (animate && pCenter && Number.isFinite(pZoom)) ? animateGeoViewTo(pCenter, pZoom, 680) : Promise.resolve();

      const [geojson] = await Promise.all([fetchPromise, animPromise]);
      if (mySeq !== drillSeq) return;

      selectedCitiesGeoJson = geojson;
      const cnt = Array.isArray(geojson?.features) ? geojson.features.length : 0;
      if (!cnt) return;
      setCityBordersMap(id, geojson, (pCenter && Number.isFinite(pZoom)) ? { center: pCenter, zoom: pZoom } : null);
      updateMap();
    }

    async function autoFocusToMatched(matched, cascadeIds) {
      if (!matched) return;
      if (!isChartUsable()) return;

      cancelAutoReturn();
      clearFocusLabel();
      // 渐显：点亮触发自动聚焦时更柔和
      // playMapFadeIn(420, 0.26);
      const rawId = String(matched.id || '').trim();
      const rawLvl = matched.level || inferLevelFromAdcode(rawId);
      const id = normalizeRegionIdByLevel(rawId, rawLvl);
      const lvl = rawLvl || inferLevelFromAdcode(id);
      if (!id || !lvl) return;

      // 自动聚焦开始：不希望之后的旧异步流程覆盖当前视图
      drillSeq++;

      if (lvl === 'province') {
        if (!isChartUsable()) return;
        // 省：只聚焦省，不显示市级边界
        selectedProvince = null;
        selectedCity = null;
        selectedCitiesGeoJson = null;
        currentMapLevel = 'province';
        currentViewRegion = null;
        cityFeatureNameById = new Map();
        cityFeatureById = new Map();
        districtFeatureNameById = new Map();
        districtFeatureById = new Map();
        console.log("设置前");
        chart.setOption(
          {
            geo: [
              { map: 'china', silent: false, emphasis: { label: { show: true } } },
              { show: false, map: 'china', silent: false },
              { show: false, map: 'china', silent: false }
            ]
          },
          { notMerge: false, lazyUpdate: false, silent: true }
        );
        updateMap();
        await ensureProvinceHitGeoLoaded();
        if (!isChartUsable()) return;
        const pFeature = provinceFeatureById.get(id) || null;
        const pCenter = featureCenterFromGeometry(pFeature) || pickFeatureCoord(pFeature) || pickMatchedCoord(matched);
        const pZoom = computeProvinceTargetZoom(pFeature);
        if (pCenter && Number.isFinite(pZoom)) {
          await animateGeoViewTo(pCenter, pZoom, 680);
        }
        if (!isChartUsable()) return;
        updateMap();
        if (pCenter) {
          const a = resolveAnchorForLevel('province', id, pCenter);
          const anchorCoord = a?.coord || pCenter;
          const anchorGi = Number.isFinite(Number(a?.geoIndex)) ? Number(a.geoIndex) : 0;
          showFocusLabel(String(matched.name || ''), anchorCoord, 1000);
          await delay(1050);
          clearFocusLabel();
          scheduleAutoReturnToNational();
          await playFireworkAt(anchorCoord, '马年吉祥', anchorGi);
        }
        if (!pCenter) scheduleAutoReturnToNational();
        return;
      }

      const pId = provinceIdFromAny(id);
      if (!pId) return;
      await drillToProvinceByCode(pId, { animate: true });

      // 第一步：省级提示 + 等待（让两段动画间隔拉长）
      const pName = provinceFeatureNameById.get(pId) || litRegionsMetaById[pId]?.name || '';
      const pFeature = provinceFeatureById.get(pId) || null;
      const pCoord = featureCenterFromGeometry(pFeature) || pickFeatureCoord(pFeature);
      if (pCoord && pName) {
        showFocusLabel(pName, pCoord, 1000);
        await delay(1000);
      } else {
        await delay(1000);
      }

      if (lvl === 'city') {
        currentMapLevel = 'city';
        selectedCity = null;
        await focusCityByCode(id, { animate: true });

        // 第二步：市级提示 + 等待
        const cFeature = cityFeatureById.get(id) || null;
        const cCoord = featureCenterFromGeometry(cFeature) || pickFeatureCoord(cFeature) || pickMatchedCoord(matched);
        const cName = cityFeatureNameById.get(id) || litRegionsMetaById[id]?.name || matched.name || '';
        if (cCoord && cName) {
          const a = resolveAnchorForLevel('city', id, cCoord);
          const anchorCoord = a?.coord || cCoord;
          const anchorGi = Number.isFinite(Number(a?.geoIndex)) ? Number(a.geoIndex) : 1;
          showFocusLabel(cName, anchorCoord, 1000);
          await delay(1050);
          clearFocusLabel();
          scheduleAutoReturnToNational();
          await playFireworkAt(anchorCoord, '马年吉祥', anchorGi);
          await delay(1050);
        }
        if (!(cCoord && cName)) scheduleAutoReturnToNational();
        return;
      }

      const cId = cityIdFromAny(id);
      if (!cId) return;
      await drillToCityByCode(cId, { animate: true });

      // 第二步：市级提示 + 等待
      const cFeature = cityFeatureById.get(cId) || null;
      const cCoord = featureCenterFromGeometry(cFeature) || pickFeatureCoord(cFeature);
      const cName = cityFeatureNameById.get(cId) || litRegionsMetaById[cId]?.name || '';
      if (cCoord && cName) {
        showFocusLabel(cName, cCoord, 1000);
        await delay(1000);
      } else {
        await delay(1000);
      }

      await focusDistrictByCode(id, { animate: true });

      // 第三步：区县提示
      const dFeature = districtFeatureById.get(id) || null;
      const dCoord = featureCenterFromGeometry(dFeature) || pickFeatureCoord(dFeature) || pickMatchedCoord(matched);
      const dName = districtFeatureNameById.get(id) || litRegionsMetaById[id]?.name || matched.name || '';
      if (dCoord && dName) {
        const a = resolveAnchorForLevel('district', id, dCoord);
        const anchorCoord = a?.coord || dCoord;
        const anchorGi = Number.isFinite(Number(a?.geoIndex)) ? Number(a.geoIndex) : 2;
        showFocusLabel(dName, anchorCoord, 1000);
        await delay(1050);
        clearFocusLabel();
        scheduleAutoReturnToNational();
        await playFireworkAt(anchorCoord, '马年吉祥', anchorGi);
      }
      if (!(dCoord && dName)) scheduleAutoReturnToNational();
    }

    async function selectProvinceByCoord(coord) {
      const mySeq = ++drillSeq;
      await ensureProvinceHitGeoLoaded();
      const hit = geoDataCache['china_province_hit'];
      const p = findProvinceByPoint(coord, hit);
      if (!p?.code) return false;

      // 再点一次同一省：收起回省级
      if (selectedProvince && String(selectedProvince.code) === String(p.code) && !selectedCity) {
        clearDrilldown();
        return true;
      }

      // 切换省份：清空市/区县
      const changed = !selectedProvince || String(selectedProvince.code) !== String(p.code);
      selectedProvince = { code: String(p.code), name: p.name };
      selectedCity = null;
      selectedCitiesGeoJson = null;
      // geo overlay 模式下，不再需要清理 series

      currentMapLevel = 'city';
      currentViewRegion = String(selectedProvince.code);
      UIController.updateLevelIndicator('layered', `${selectedProvince.name} - 市级边界`);

      // 让浏览器先渲染一帧（减少“点击后空档期”的卡顿感）
      await new Promise(requestAnimationFrame);

      const cacheKey = `province:${selectedProvince.code}:citiesGeo`;
      const needFetch = !geoDataCache[cacheKey] || changed;

      let loadingTimer = null;
      let loadingShown = false;
      const showLoadingIfSlow = () => {
        loadingShown = true;
        UIController.showLoading('加载地图数据', `正在加载${selectedProvince.name}市级边界...`);
      };

      const fetchPromise = (async () => {
        if (!needFetch) return geoDataCache[cacheKey];
        // 如果网络慢，延迟一点再显示 loading，避免“闪一下就没了”造成顿挫
        loadingTimer = setTimeout(showLoadingIfSlow, 180);
        const response = await fetch(`/api/geo/province/${selectedProvince.code}`);
        if (!response.ok) {
          throw new Error(`市级边界接口返回 HTTP ${response.status}`);
        }
        const geojson = await response.json();
        geoDataCache[cacheKey] = geojson;
        return geojson;
      })();

      // 根据省份大小一次性计算“合适 zoom”（可放大也可缩小）
      const pFeature = provinceFeatureById.get(String(p.code)) || null;
      const props = pFeature?.properties || {};
      const c = props?.centroid || props?.center || props?.cp;
      const pCenter = (Array.isArray(c) && c.length === 2 && Number.isFinite(Number(c[0])) && Number.isFinite(Number(c[1])))
        ? [Number(c[0]), Number(c[1])]
        : null;
      const targetZoom = computeProvinceTargetZoom(pFeature);

      const animPromise = (pCenter && Number.isFinite(targetZoom))
        ? animateGeoViewTo(pCenter, targetZoom, 680)
        : Promise.resolve();

      // 动画与数据加载并行；但边界线要等动画结束后再显示
      await animPromise;
      const geojson = await fetchPromise;
      if (loadingTimer) clearTimeout(loadingTimer);
      if (loadingShown) UIController.hideLoading();

      // 若用户已退回/切换（序列号变化），忽略过期结果
      if (mySeq !== drillSeq) return true;

      selectedCitiesGeoJson = geojson;
      const cnt = Array.isArray(selectedCitiesGeoJson?.features) ? selectedCitiesGeoJson.features.length : 0;
      console.log('🧭 省钻取:', selectedProvince, 'cities features=', cnt);
      if (!cnt) {
        UIController.showError('无市级边界数据', `${selectedProvince.name} 的市级边界数据为空（可能数据文件缺失/损坏）。`);
        return;
      }
      setCityBordersMap(
        selectedProvince.code,
        selectedCitiesGeoJson,
        (pCenter && Number.isFinite(targetZoom)) ? { center: pCenter, zoom: targetZoom } : null
      );
      updateMap();
      return true;
    }

    async function selectCityByCoord(coord) {

      const c = findCityByPoint(coord, selectedCitiesGeoJson);
      if (!c?.code) return false;

      const mySeq = ++drillSeq;

      // 再点一次同一市：收起区县，回到市级

        selectedCity = null;
        currentMapLevel = 'city';
        currentViewRegion = String(selectedProvince.code);
        // 收起区县 overlay
        chart.setOption(
          {
            geo: [
              {},
              { silent: false, show: true },
              { show: false, map: 'china', silent: false }
            ]
          },
          { notMerge: false }
        );
        UIController.updateLevelIndicator('layered', `${selectedProvince.name} - 市级边界`);
        updateMap();
        return true;
      }

      const changed = !selectedCity || String(selectedCity.code) !== String(c.code);
      selectedCity = { code: String(c.code), name: c.name };
      currentMapLevel = 'district';
      currentViewRegion = String(selectedCity.code);

      // 让浏览器先渲染一帧，减少点击后的“空档感”
      await new Promise(requestAnimationFrame);

      // 城市点击：动画聚焦（居中+一次性缩放），动画结束后再显示区县边界
      const cFeature = cityFeatureById.get(String(selectedCity.code)) || null;
      const cProps = cFeature?.properties || {};
      const cc = cProps?.centroid || cProps?.center || cProps?.cp;
      const cCenter = (Array.isArray(cc) && cc.length === 2 && Number.isFinite(Number(cc[0])) && Number.isFinite(Number(cc[1])))
        ? [Number(cc[0]), Number(cc[1])]
        : null;
      const cityTargetZoom = computeCityTargetZoom(cFeature);

      const cacheKey = `city:${selectedCity.code}:districtsGeo`;
      const needFetch = !geoDataCache[cacheKey] || changed;

      let loadingTimer = null;
      let loadingShown = false;
      const showLoadingIfSlow = () => {
        loadingShown = true;
        UIController.showLoading('加载地图数据', `正在加载${selectedCity.name}区县边界...`);
      };

      const fetchPromise = (async () => {
        if (!needFetch) return geoDataCache[cacheKey];
        loadingTimer = setTimeout(showLoadingIfSlow, 180);
        const response = await fetch(`/api/geo/city/${selectedCity.code}`);
        const geojson = response.ok ? await response.json() : { type: 'FeatureCollection', features: [] };
        geoDataCache[cacheKey] = geojson;
        return geojson;
      })();

      const animPromise = (cCenter && Number.isFinite(cityTargetZoom))
        ? animateGeoViewTo(cCenter, cityTargetZoom, 640)
        : Promise.resolve();

      await animPromise;
      const districtsGeo = await fetchPromise;
      if (loadingTimer) clearTimeout(loadingTimer);
      if (loadingShown) UIController.hideLoading();

      if (mySeq !== drillSeq) return true;

      setDistrictBordersMap(
        selectedCity.code,
        districtsGeo,
        (cCenter && Number.isFinite(cityTargetZoom)) ? { center: cCenter, zoom: cityTargetZoom } : null
      );
      updateMap();
      return true;
    }

    async function handleMapClick(evt) {
      if (!chart) return;
      cancelAutoReturnByUser();

      // 尽量阻止 ECharts 默认的“选择高亮”行为
      try {
        evt?.event?.preventDefault?.();
        evt?.event?.stopPropagation?.();
      } catch (_) {
        // ignore
      }

      const pixel = [evt.offsetX, evt.offsetY];
      const coord = chart.convertFromPixel({ geoIndex: 0 }, pixel);
      const coordOk = Array.isArray(coord) && coord.length === 2 && Number.isFinite(coord[0]) && Number.isFinite(coord[1]);

      // 点击地图外（不在中国地图可投影区域）：默认提升一级
      if (!coordOk) {
        handleOutsideClickGoUp();
        return;
      }

      try {
        // 已选省：优先尝试选市（点在市级多边形内）
        if (selectedProvince?.code && selectedCitiesGeoJson) {
          const pickedCity = await selectCityByCoord(coord);
          if (pickedCity) {
            UIController.hideLoading();
            return;
          }
        }

        // 否则（或没命中市）：按点所在省切换
        const pickedProvince = await selectProvinceByCoord(coord);
        if (!pickedProvince) {
          // 点击在中国轮廓外/空白处：提升一级
          handleOutsideClickGoUp();
        }
      } catch (e) {
        console.error('点击钻取失败:', e);
        UIController.showError('钻取失败', e.message || '点击钻取失败');
      } finally {
        UIController.hideLoading();
      }
    }

    // 加载所需的地理数据
    async function loadRequiredGeoData(center, options) {
      const data = {
        provinces: null,
        cities: null,
        districts: null,
        focus: {
          province: null,
          city: null
        }
      };

      try {
        // 始终加载省级地图（基础层）
        if (!geoDataCache['china']) {
          UIController.showLoading('加载地图数据', '正在获取省级地理数据...');
          const response = await fetch('/api/geo/china');
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          data.provinces = await response.json();
          geoDataCache['china'] = data.provinces;
          console.log('✅ 省级地图数据加载完成');
        } else {
          data.provinces = geoDataCache['china'];
          console.log('✅ 使用缓存的省级地图数据');
        }

        // 命中测试用的“省级轮廓”（避免 /api/geo/china 可能是县级超大数据导致遍历过慢）
        if (!geoDataCache['china_province_hit']) {
          try {
            const response = await fetch('/vendor/echarts/map/json/china.json', { cache: 'force-cache' });
            if (response.ok) {
              geoDataCache['china_province_hit'] = await response.json();
            }
          } catch (_) {
            // ignore
          }
        }

        // 先确定当前省份（用于后续加载市/区县）
        const hitChina = geoDataCache['china_province_hit'] || data.provinces;
        data.focus.province = findProvinceByPoint(center, hitChina);

        // 根据需要加载市级数据
        if (options.showCities && data.focus.province) {
          const mapKey = `${data.focus.province.code}_cities`;
          if (!geoDataCache[mapKey]) {
            UIController.showLoading('加载地图数据', `正在获取${data.focus.province.name}市级地理数据...`);
            const response = await fetch(`/api/geo/province/${data.focus.province.code}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            data.cities = await response.json();
            geoDataCache[mapKey] = data.cities;
            console.log(`✅ ${data.focus.province.name}市级地图数据加载完成`);
          } else {
            data.cities = geoDataCache[mapKey];
            console.log(`✅ 使用缓存的${data.focus.province.name}市级地图数据`);
          }

          // 有了市级边界后，再确定当前城市
          data.focus.city = findCityByPoint(center, data.cities);
        }

        // 根据需要加载区县级数据
        if (options.showDistricts && data.focus.city) {
          const mapKey = `${data.focus.city.code}_districts`;
          if (!geoDataCache[mapKey]) {
            UIController.showLoading('加载地图数据', `正在获取${data.focus.city.name}区县级地理数据...`);
            const response = await fetch(`/api/geo/city/${data.focus.city.code}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const geojson = await response.json();

            // 检查数据有效性
            if (!geojson.features || geojson.features.length === 0) {
              console.warn(`⚠️ ${data.focus.city.name}暂无区县级地图数据`);
              data.districts = null;
            } else {
              data.districts = geojson;
              geoDataCache[mapKey] = data.districts;
              console.log(`✅ ${data.focus.city.name}区县级地图数据加载完成`);
            }
          } else {
            data.districts = geoDataCache[mapKey];
            console.log(`✅ 使用缓存的${data.focus.city.name}区县级地图数据`);
          }
        }

      } catch (error) {
        console.error('❌ 加载地理数据失败:', error);
        UIController.showError('数据加载失败', error.message);
      } finally {
        UIController.hideLoading();
      }

      return data;
    }

    // 使用多层级数据更新地图显示（叠加显示）
    function updateMapWithLayers(geoData, displayOptions) {
      if (!chart || !geoData.provinces) return;

      // 合并所有需要显示的地理要素
      let combinedFeatures = [];

      // 始终添加省级边界（作为基础层）
      if (displayOptions.showProvinces && geoData.provinces) {
        // 省级边界使用较粗的线条和半透明填充
        geoData.provinces.features.forEach(feature => {
          combinedFeatures.push({
            ...feature,
            properties: {
              ...feature.properties,
              level: 'province',
              name: feature.properties.name || feature.properties.adcode
            }
          });
        });
      }

      // 叠加市级边界
      if (displayOptions.showCities && geoData.cities) {
        geoData.cities.features.forEach(feature => {
          combinedFeatures.push({
            ...feature,
            properties: {
              ...feature.properties,
              level: 'city',
              name: feature.properties.name || feature.properties.adcode
            }
          });
        });
      }

      // 叠加区县级边界
      if (displayOptions.showDistricts && geoData.districts) {
        geoData.districts.features.forEach(feature => {
          combinedFeatures.push({
            ...feature,
            properties: {
              ...feature.properties,
              level: 'district',
              name: feature.properties.name || feature.properties.adcode
            }
          });
        });
      }

      // 创建合并的GeoJSON
      const combinedGeoJson = {
        type: "FeatureCollection",
        features: combinedFeatures
      };

      // 注册合并后的地图
      echarts.registerMap('layered_map', combinedGeoJson);

      // 更新地图配置
      updateLayeredMapConfig(displayOptions);

      // 更新当前层级状态
      currentMapLevel = displayOptions.showDistricts ? 'district' :
               displayOptions.showCities ? 'city' : 'province';
    }

    function pickAdcode(props) {
      const v = props?.adcode ?? props?.ad_code ?? props?.adCode ?? props?.id ?? props?.code;
      if (v === null || v === undefined) return null;
      const s = String(v).trim();
      return s ? s : null;
    }

    function pointInRing(point, ring) {
      const x = point[0];
      const y = point[1];
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0];
        const yi = ring[i][1];
        const xj = ring[j][0];
        const yj = ring[j][1];
        const intersect = ((yi > y) !== (yj > y)) && (x < ((xj - xi) * (y - yi)) / (yj - yi + 0.0) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function pointInPolygon(point, rings) {
      if (!Array.isArray(rings) || rings.length === 0) return false;
      const outer = rings[0];
      if (!pointInRing(point, outer)) return false;
      // holes
      for (let i = 1; i < rings.length; i++) {
        if (pointInRing(point, rings[i])) return false;
      }
      return true;
    }

    function pointInGeometry(point, geometry) {
      const type = geometry?.type;
      const coords = geometry?.coordinates;
      if (!type || !coords) return false;
      if (type === 'Polygon') {
        return pointInPolygon(point, coords);
      }
      if (type === 'MultiPolygon') {
        for (const poly of coords) {
          if (pointInPolygon(point, poly)) return true;
        }
      }
      return false;
    }

    function findFeatureByPoint(point, geojson) {
      const features = Array.isArray(geojson?.features) ? geojson.features : [];
      for (const f of features) {
        if (pointInGeometry(point, f?.geometry)) return f;
      }
      return null;
    }

    // 根据经纬度点找到省份（用省级轮廓 GeoJSON 命中）
    function findProvinceByPoint(point, provincesGeoJson) {
      const f = findFeatureByPoint(point, provincesGeoJson);
      if (!f) return null;
      const props = f.properties || {};
      const code = pickAdcode(props);
      const name = String(props.name || props.NAME || props.fullname || '').trim() || (code || '');
      if (!code) return null;
      return { code, name };
    }

    // 根据经纬度点找到城市（用“省内市级边界” GeoJSON 命中）
    function findCityByPoint(point, citiesGeoJson) {
      const f = findFeatureByPoint(point, citiesGeoJson);
      if (!f) return null;
      const props = f.properties || {};
      const code = pickAdcode(props);
      const name = String(props.name || props.NAME || props.fullname || '').trim() || (code || '');
      if (!code) return null;
      return { code, name };
    }

    // 更新地图（闪烁小点 + 右侧列表）
    function updateMap() {
      if (!chart || !chartReady) {
        pendingMapUpdate = true;
        return;
      }
      pendingMapUpdate = false;
      applyLayerColors();
      updateScatterPoints(); // 添加闪烁小点更新
    }
    
    // 更新闪烁小点
    function updateScatterPoints() {
      if (!chart || !chartReady) return;
      
      // 准备散点数据
      const scatterData = [];
      
      // 1. 首先，收集所有点亮的区域ID，并按层级分类
      const allRegionIds = Object.keys(litRegionState || {});
      const provinceIds = allRegionIds.filter(id => isProvinceAdcode(id));
      const cityIds = allRegionIds.filter(id => isCityAdcode(id));
      const districtIds = allRegionIds.filter(id => isDistrictAdcode(id));
      
      // 2. 只保留最具体层级的点：区县 > 市 > 省
      const validRegionIds = [];
      
      // a. 保留所有区县ID（最具体）
      validRegionIds.push(...districtIds);
      
      // b. 保留没有对应区县的市ID
      for (const cityId of cityIds) {
        const hasDistrict = districtIds.some(districtId => districtId.startsWith(cityId.slice(0, 4)));
        if (!hasDistrict) {
          validRegionIds.push(cityId);
        }
      }
      
      // c. 保留没有对应市或区县的省ID
      for (const provinceId of provinceIds) {
        const hasCity = cityIds.some(cityId => cityId.startsWith(provinceId.slice(0, 2)));
        const hasDistrict = districtIds.some(districtId => districtId.startsWith(provinceId.slice(0, 2)));
        if (!hasCity && !hasDistrict) {
          validRegionIds.push(provinceId);
        }
      }
      
      // 3. 根据有效区域ID生成散点数据
      for (const id of validRegionIds) {
        const st = litRegionState[id];
        const meta = litRegionsMetaById[String(id)];
        if (!meta || !meta.centroid) continue;
        
        // 转换为经纬度坐标
        const coord = normalizeLonLat(meta.centroid);
        if (!coord) continue;
        
        scatterData.push({
          name: meta.name,
          value: [...coord, 1],
          regionId: id
        });
      }
      
      // 检查是否已有散点图系列
      const hasScatterSeries = chart.getOption().series?.some(s => s.id === 'litPoints');
      
      if (hasScatterSeries) {
        // 更新现有系列数据
        chart.setOption({
          series: [
            {
              id: 'litPoints',
              data: scatterData
            },
            {
              id: 'ripplePoints',
              data: scatterData
            }
          ]
        });
      } else {
        // 添加新的散点图系列
        chart.setOption({
          series: [
            {
              id: 'litPoints',
              type: 'scatter',
              coordinateSystem: 'geo',
              geoIndex: 0,
              data: scatterData,
              symbol: 'circle',
              symbolSize: 8,
              animation: true,
              animationDuration: 1000,
              animationEasing: 'ease-out',
              itemStyle: {
                color: '#ffd700',
                opacity: 0.9
              },
              emphasis: {
                focus: 'series',
                itemStyle: {
                  color: '#ffed4e',
                  opacity: 1,
                  shadowBlur: 10,
                  shadowColor: 'rgba(255, 215, 0, 0.8)'
                },
                label: {
                  show: true,
                  formatter: '{b}',
                  color: '#ffd700',
                  fontSize: 12
                }
              }
            },
            // 添加涟漪效果的散点图
            {
              id: 'ripplePoints',
              type: 'effectScatter',
              coordinateSystem: 'geo',
              geoIndex: 0,
              data: scatterData,
              symbol: 'circle',
              symbolSize: 8,
              showEffectOn: 'render',
              rippleEffect: {
                period: 2,
                scale: 3,
                brushType: 'fill'
              },
              itemStyle: {
                color: '#ffd700',
                opacity: 0.6
              },
              z: 10
            }
          ]
        });
      }
    }
