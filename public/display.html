    function startHistoryScroll() {
      stopHistoryScroll();
      historyTimer = setInterval(() => {
        const box = document.getElementById('historyBox');
        if (!box || box.children.length <= 1) return;
        const last = box.lastElementChild;
        if (!last) return;
        last.style.opacity = '0.2';
        setTimeout(() => {
          box.insertBefore(last, box.firstElementChild);
          last.style.opacity = '1';
        }, 250);
      }, 2500);
    }

    function stopHistoryScroll() {
      if (historyTimer) {
        clearInterval(historyTimer);
        historyTimer = null;
      }
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // WebSocket 事件处理
    ws.onopen = function () {
      console.log('✅ WebSocket 连接成功');
      updateStatus('已连接', true);
    };

    // 重新赋值ws.onmessage，确保能访问到所有函数
    ws.onmessage = function (event) {
      const data = event.data;
      
      // 处理WebSocket消息的核心函数
      function processMessage(message) {
        console.log('📨 收到消息:', message);
        
        if (message.type === 'adminCommand') {
          // 处理管理员命令
          if (message.command === 'initializeView') {
            // 执行初始化视图操作
            console.log('执行初始化视图操作');
            // 直接调用goToInitialView，避免函数作用域问题
            goToInitialView({ showToast: true }).catch(error => {
              console.error('初始化视图操作失败:', error);
            });
          }
        } else if (message.type === 'initial_state') {
          const stats = message.data?.stats || {};
          document.getElementById('litCount').textContent = stats.litCount || 0;
          document.getElementById('totalCount').textContent = stats.totalSubmissions || 0;

        // 构建 meta 映射
        litRegionsMetaById = {};
        for (const r of (stats.litRegions || [])) {
          const rid = normalizeRegionIdByLevel(r.id, r.level);
          litRegionsMetaById[String(rid)] = { name: r.name, centroid: r.centroid, level: r.level, count: Number(r.count || 0) };
        }

        // 点亮状态：按次数
        litRegionState = {};
        for (const r of (stats.litRegions || [])) {
          const rid = normalizeRegionIdByLevel(r.id, r.level);
          litRegionState[String(rid)] = {
            count: Number(r.count || 0),
            firstNickname: r.firstNickname || null,
            matchedName: r.name,
            firstLitAt: r.firstLitAt || null,
            lastLitAt: r.lastLitAt || null
          };
        }

        historyItems = Array.isArray(message.data?.history) ? message.data.history : [];
        renderHistoryBox();
        startHistoryScroll();
        updateMap();
      } else if (message.type === 'region_lit') {
        const d = message.data || {};
        const stats = d.stats || {};
        document.getElementById('litCount').textContent = stats.litCount || 0;
        document.getElementById('totalCount').textContent = stats.totalSubmissions || 0;

        // 直接用 stats.litRegions 重建，保证层级累计（省/市/区县）都能同步到前端
        if (Array.isArray(stats.litRegions)) {
          litRegionsMetaById = {};
          litRegionState = {};
          for (const r of stats.litRegions) {
            const rid = normalizeRegionIdByLevel(r.id, r.level);
            litRegionsMetaById[String(rid)] = { name: r.name, centroid: r.centroid, level: r.level, count: Number(r.count || 0) };
            litRegionState[String(rid)] = {
              count: Number(r.count || 0),
              firstNickname: r.firstNickname || null,
              matchedName: r.name,
              firstLitAt: r.firstLitAt || null,
              lastLitAt: r.lastLitAt || null
            };
          }
        }

        const regionId = String(d.regionId);
        const regionName = d?.matched?.name || d.regionName || regionId;
        const displayPlace = String(d.inputPlaceName || d.placeName || regionName);

        // push history：始终使用用户输入
        historyItems.push({ nickname: d.nickname, inputPlaceName: displayPlace, matched: d.matched, createdAt: d.timestamp });
        if (historyItems.length > 200) historyItems = historyItems.slice(-200);
        renderHistoryBox();
        updateMap();

        // 手机端点亮后：入队自动聚焦（省/市/区县），3 秒无人操作回全国
        enqueueAutoFocus(d.matched, d.cascadeIds);

        showToast(`${d.nickname} 点亮了 ${displayPlace}`);
      } else if (message.type === 'submission') {
        // 未匹配到地名：只更新滚动记录，不改变地图
        const d = message.data || {};
        const stats = d.stats || {};
        document.getElementById('litCount').textContent = stats.litCount || 0;
        document.getElementById('totalCount').textContent = stats.totalSubmissions || 0;

        const displayPlace = String(d.inputPlaceName || '');
        historyItems.push({ nickname: d.nickname, inputPlaceName: displayPlace, matched: null, createdAt: d.createdAt || new Date().toISOString() });
        if (historyItems.length > 200) historyItems = historyItems.slice(-200);
        renderHistoryBox();
        showToast(`${d.nickname} 提交了 ${displayPlace}（未匹配）`);
      } else if (message.type === 'reset') {
        litRegionState = {};
        litRegionsMetaById = {};
        historyItems = [];
        document.getElementById('litCount').textContent = '0';
        document.getElementById('totalCount').textContent = '0';
        renderHistoryBox();
        updateMap();
        showToast('🔄 地图已重置');
      }
      }
      
      try {
        if (typeof data === 'string') {
          // 处理字符串消息
          console.log('📨 收到字符串消息，正在解析...');
          const parsedMessage = JSON.parse(data);
          processMessage(parsedMessage);
        } else if (data instanceof Blob) {
          // 处理Blob消息
          console.log('📨 收到Blob消息，正在转换...');
          const reader = new FileReader();
          reader.onload = function(e) {
            try {
              const text = e.target.result;
              const parsedMessage = JSON.parse(text);
              processMessage(parsedMessage);
            } catch (error) {
              console.error('❌ Blob消息解析失败:', error);
            }
          };
          reader.onerror = function(error) {
            console.error('❌ Blob读取失败:', error);
          };
          reader.readAsText(data);
        } else {
          // 处理其他类型消息
          console.log('📨 收到其他类型消息:', data);
        }
      } catch (error) {
        console.error('❌ WebSocket消息处理失败:', error);
        console.error('原始消息:', data);
      }
  };

  ws.onerror = function (error) {
    console.error('❌ WebSocket 错误:', error);
    updateStatus('连接错误', false);
  };

  ws.onclose = function () {
    console.log('📵 WebSocket 连接已关闭');
    updateStatus('已断开', false);
  };

    // 更新连接状态
    function updateStatus(text, isConnected) {
      const status = document.getElementById('status');
      document.getElementById('statusText').textContent = text;
      status.className = `connection-status ${isConnected ? 'connected' : 'disconnected'}`;
    }

    // 显示提示信息
    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // 重置地图
    function resetMap() {
      const password = prompt('输入管理员口令:');
      if (password === null) return;

      fetch('/api/admin/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      })
        .then(r => r.json())
        .then(data => {
          if (data.ok) {
            showToast('✅ 重置成功');
          } else {
            showToast('❌ ' + data.message);
          }
        })
        .catch(e => showToast('❌ 错误: ' + e.message));
    }

    // 导出数据
    function downloadStats() {
      fetch('/api/history?limit=10000')
        .then(r => r.json())
        .then(data => {
          const jsonStr = JSON.stringify(data, null, 2);
          const blob = new Blob([jsonStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `mpit-data-${new Date().getTime()}.json`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('✅ 数据已导出');
        })
        .catch(e => showToast('❌ 导出失败: ' + e.message));
    }

    // 生成二维码
    function generateQRCode() {
      fetch('/api/qrcode')
        .then(r => r.json())
        .then(data => {
          if (data.ok) {
            document.getElementById('qrcode').innerHTML = `<img src="${data.qrCode}" />`;
            document.getElementById('urlDisplay').textContent = data.url;
          }
        })
        .catch(e => {
          console.error('生成二维码失败:', e);
          // 降级方案：使用外部 API
          const url = window.location.origin + '/mobile.html';
          const qrCodeApi = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(url)}`;
          document.getElementById('qrcode').innerHTML = `<img src="${qrCodeApi}" />`;
          document.getElementById('urlDisplay').textContent = url;
        });
    }

    // 页面加载
    window.addEventListener('load', () => {
      ensureChinaMapRegistered()
        .then(() => {
          initChart();
        })
        .catch((e) => {
          console.error(e);
          showToast('❌ 地图资源加载失败（china.json）');
        })
        .finally(() => {
          generateQRCode();
        });

      // 兜底：如果 WS 很慢/不可用，拉一次当前状态 + 历史
      Promise.all([
        fetch('/api/lit/state').then(r => r.json()).catch(() => null),
        fetch('/api/history?limit=50').then(r => r.json()).catch(() => null)
      ]).then(([stateRes, historyRes]) => {
        if (stateRes && stateRes.ok) {
          document.getElementById('litCount').textContent = stateRes.litCount || 0;
          document.getElementById('totalCount').textContent = stateRes.totalSubmissions || 0;

          litRegionsMetaById = {};
          litRegionState = {};
          for (const r of (stateRes.litRegions || [])) {
            const id = String(r.id);
            const cnt = Number(r.count ?? (r.isLit ? 1 : 0) ?? 0);
            litRegionsMetaById[id] = { name: r.name, centroid: r.centroid, level: r.level, count: cnt };
            litRegionState[id] = {
              count: cnt,
              firstNickname: r.firstNickname || null,
              matchedName: r.name,
              firstLitAt: r.firstLitAt || r.litAt || null,
              lastLitAt: r.lastLitAt || r.litAt || null
            };
          }
          updateMap();
        }

        if (historyRes && historyRes.ok) {
          historyItems = Array.isArray(historyRes.data) ? historyRes.data : [];
          renderHistoryBox();
          startHistoryScroll();
        }
      });
    });
  </script>
</body>
