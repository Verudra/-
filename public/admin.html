<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .login-panel, .admin-panel {
      background: rgba(49, 74, 67, 0.9);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 215, 0, 0.3);
    }

    .admin-panel {
      display: none;
    }

    h1 {
      text-align: center;
      color: #ffd700;
      margin-bottom: 30px;
      font-size: 2em;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #ffffff;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #ffd700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #ffd700, #ffed4e);
      color: #333;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
    }

    .admin-btn {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .admin-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .admin-btn.danger {
      background: linear-gradient(135deg, #f093fb, #f5576c);
    }

    .admin-btn.secondary {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
    }

    .logout-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #fa709a, #fee140);
      color: #333;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 20px;
    }

    .logout-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(250, 112, 154, 0.4);
    }

    .error-message {
      color: #ff6b6b;
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
    }

    .success-message {
      color: #4ecdc4;
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 登录面板 -->
    <div class="login-panel" id="loginPanel">
      <h1>管理员登录</h1>
      <div class="form-group">
        <label for="username">账号</label>
        <input type="text" id="username" placeholder="请输入账号">
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码">
      </div>
      <button class="login-btn" onclick="handleLogin()">登录</button>
      <div class="error-message" id="errorMessage"></div>
    </div>

    <!-- 管理面板 -->
    <div class="admin-panel" id="adminPanel">
      <h1>管理功能</h1>
      <button class="admin-btn" onclick="initializeMapView()">初始化视图</button>
      <button class="admin-btn danger" onclick="resetMap()">重置数据</button>
      <button class="admin-btn secondary" onclick="downloadStats()">导出数据</button>
      <button class="logout-btn" onclick="handleLogout()">退出登录</button>
      <div class="success-message" id="successMessage"></div>
    </div>
  </div>

  <script>
    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    let ws = null;
    let isAuthenticated = false;

    // 处理登录
    function handleLogin() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');

      if (username === 'admin' && password === 'admin') {
        // 登录成功
        isAuthenticated = true;
        document.getElementById('loginPanel').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        errorMessage.textContent = '';
        initWebSocket();
      } else {
        // 登录失败
        errorMessage.textContent = '账号或密码错误';
      }
    }

    // 处理退出
    function handleLogout() {
      isAuthenticated = false;
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('loginPanel').style.display = 'block';
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('successMessage').textContent = '';
      if (ws) {
        ws.close();
        ws = null;
      }
    }

    // 初始化WebSocket连接
    function initWebSocket() {
      console.log('正在尝试建立WebSocket连接:', `${wsProtocol}//${window.location.host}`);
      ws = new WebSocket(`${wsProtocol}//${window.location.host}`);

      ws.onopen = () => {
        console.log('✅ WebSocket连接已建立');
        document.getElementById('successMessage').textContent = 'WebSocket连接已建立';
        setTimeout(() => {
          document.getElementById('successMessage').textContent = '';
        }, 3000);
      };

      ws.onmessage = (event) => {
        const data = event.data;
        if (typeof data === 'string') {
          // 字符串类型数据，直接解析
          try {
            const message = JSON.parse(data);
            console.log('📨 收到WebSocket消息:', message);
          } catch (error) {
            console.error('❌ JSON解析失败:', error);
            console.error('原始消息:', data);
          }
        } else if (data instanceof Blob) {
          // Blob类型数据，先转换为字符串
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const message = JSON.parse(e.target.result);
              console.log('📨 收到WebSocket Blob消息:', message);
            } catch (error) {
              console.error('❌ Blob JSON解析失败:', error);
              console.error('Blob内容:', e.target.result);
            }
          };
          reader.onerror = (error) => {
            console.error('❌ Blob读取失败:', error);
          };
          reader.readAsText(data);
        } else {
          // 其他类型数据
          console.log('📨 收到WebSocket其他类型消息:', data);
        }
      };

      ws.onclose = () => {
        console.log('❌ WebSocket连接已关闭');
        ws = null;
      };

      ws.onerror = (error) => {
        console.error('❌ WebSocket错误:', error);
        document.getElementById('successMessage').textContent = 'WebSocket连接错误: ' + error.message;
        setTimeout(() => {
          document.getElementById('successMessage').textContent = '';
        }, 3000);
      };
    }

    // 初始化视图
    function initializeMapView() {
      if (!isAuthenticated) return;
      
      console.log('尝试发送初始化视图命令...');
      
      // 检查WebSocket连接状态
      if (!ws) {
        console.error('❌ WebSocket对象未初始化');
        document.getElementById('successMessage').textContent = 'WebSocket连接未初始化';
        setTimeout(() => {
          document.getElementById('successMessage').textContent = '';
        }, 3000);
        return;
      }
      
      if (ws.readyState === WebSocket.OPEN) {
        const command = {
          type: 'adminCommand',
          command: 'initializeView'
        };
        
        console.log('📤 发送命令:', command);
        ws.send(JSON.stringify(command));
        
        document.getElementById('successMessage').textContent = '初始化视图命令已发送';
        setTimeout(() => {
          document.getElementById('successMessage').textContent = '';
        }, 3000);
      } else {
        console.error('❌ WebSocket连接未建立，状态:', ws.readyState);
        document.getElementById('successMessage').textContent = 'WebSocket连接未建立（状态: ' + ws.readyState + '）';
        setTimeout(() => {
          document.getElementById('successMessage').textContent = '';
        }, 3000);
      }
    }

    // 重置数据
    function resetMap() {
      if (!isAuthenticated) return;
      
      if (confirm('确定要重置所有数据吗？此操作不可恢复！')) {
        fetch('/api/admin/reset', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ password: 'admin' })
        })
        .then(response => response.json())
        .then(data => {
          if (data.ok) {
            document.getElementById('successMessage').textContent = '重置数据成功';
            setTimeout(() => {
              document.getElementById('successMessage').textContent = '';
            }, 3000);
          } else {
            document.getElementById('successMessage').textContent = '操作失败: ' + (data.error || '未知错误');
          }
        })
        .catch(error => {
          console.error('重置数据失败:', error);
          document.getElementById('successMessage').textContent = '操作失败: ' + error.message;
        });
      }
    }

    // 导出数据
    function downloadStats() {
      if (!isAuthenticated) return;
      
      fetch('/api/stats', {
        method: 'GET'
      })
      .then(response => response.json())
      .then(data => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `map-stats-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        document.getElementById('successMessage').textContent = '导出数据成功';
        setTimeout(() => {
          document.getElementById('successMessage').textContent = '';
        }, 3000);
      })
      .catch(error => {
        console.error('导出数据失败:', error);
        document.getElementById('successMessage').textContent = '操作失败: ' + error.message;
      });
    }

    // 监听键盘事件
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (!isAuthenticated) {
          handleLogin();
        }
      }
    });
  </script>
</body>
</html>
